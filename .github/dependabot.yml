# Weekly dependency PRs, grouped so a routine week is one PR per ecosystem
# rather than one per package. PR Checks run on each, so a breaking bump fails
# visibly instead of reaching a release.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun-dependencies:
        patterns: ['*']
    ignore:
      # typescript-eslint's peer range stops short of TypeScript 7; revisit
      # once it supports 7.x.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    groups:
      docs-site-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
