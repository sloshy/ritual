name: Deploy Docs to GitHub Pages

# Publishes https://ritual.rpeters.dev: the Starlight docs plus the live demo
# (/demo/), both built from the LATEST RELEASE, never from whatever is on main,
# so the site documents the Ritual people actually install. Docs edits merged
# to main go live with the next release.
#
# Which release: the latest stable one (GitHub's "latest release"). Prereleases
# never deploy once a stable release exists. While Ritual has no stable release
# yet, the site deploys from main instead: the prereleases before 0.1.0 predate
# demo/ and most of these docs, so deploying one would take the site backwards.
#
# Runs:
# - after each release: release.yml dispatches this workflow once the release
#   is published (a release a workflow publishes with GITHUB_TOKEN raises no
#   `release` event for other workflows, but a dispatch it sends does start one);
# - weekly, so the demo's prices stay current between releases;
# - by hand from the Actions page, optionally with a tag or branch to deploy.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to deploy (default the latest release)
        type: string
        default: ''
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Find the release to deploy
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED: ${{ inputs.ref }}
        run: |
          if [ -n "$REQUESTED" ]; then
            ref="$REQUESTED"
          # GitHub's "latest release" is the newest stable one: never a
          # prerelease or a draft. It answers 404 while there is none.
          elif ref=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2> latest.err); then
            :
          elif grep -q 'HTTP 404' latest.err; then
            ref=main
            echo "::warning::No stable release yet; deploying main."
          else
            cat latest.err >&2
            exit 1
          fi
          echo "Deploying $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.ref }}
          # Full history and tags: the Ritual built below names its version
          # (`git describe`) in the demo site's footer, and each docs page's
          # "Last updated" date comes from its last commit.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: cd docs-site && npm ci

      - name: Build site
        run: cd docs-site && npm run build

      # The live demo (https://ritual.rpeters.dev/demo/): the `demo/` workspace
      # built by the same release's Ritual, published beside the docs. It runs
      # after the Astro build, which empties docs-site/dist. `--out-dir` resolves
      # against the workspace, hence the absolute path.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build Ritual
        run: bun run build

      # The Scryfall card cache is keyed by UTC day. `--refresh auto` re-runs the
      # ~75 MB bulk download once the last one is a day old, so the first build
      # each day downloads fresh card data and later builds that day reuse it.
      # The demo keeps its cache in demo/cache (`cacheDir: "cache"` in its
      # ritual.config.json), not the runner's per-user cache, so this path holds it.
      - name: Cache day
        id: cache-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore demo card cache
        uses: actions/cache@v6
        with:
          path: demo/cache
          key: demo-card-cache-${{ steps.cache-day.outputs.day }}
          restore-keys: demo-card-cache-

      - name: Build demo site
        run: ./ritual --base-dir demo --no-input build-site --refresh auto --out-dir "$GITHUB_WORKSPACE/docs-site/dist/demo"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
