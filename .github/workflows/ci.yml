name: CI

# The gates CONTRIBUTING.md names, enforced: `bun run verify` (build, type
# check, cold lint, message catalog, unit tests, whole-repo formatting), the
# integration and Playwright suites, the docs site's build and link check, the
# repository lints (shellcheck, actionlint, hadolint, typos), the Docker image
# build, and every shipped binary started on its own OS and architecture.
#
# Runs on every pull request and every push to main. release.yml calls it
# before it publishes anything, with `skip-binaries: true` because it builds the
# release binaries itself (with the tag's version) through the same workflow.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      # Inverted so that a run with no inputs (a pull request or a push, where
      # `inputs.*` is null) builds them.
      skip-binaries:
        description: Skip building and smoke-testing the binaries (release.yml does that itself).
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (build, tsc, lint, locales, unit, format)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # scripts/precommit.ts --full: the unit suite runs under its stall guard
      # (a stalled `--parallel` run is killed and retried once).
      - run: bun run verify

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:it

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    # playwright.config.ts runs one worker under CI.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docs:
    name: Docs site (build, links)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm --prefix docs-site ci
      # starlight-links-validator fails the build on a broken internal link.
      - run: npm --prefix docs-site run build

  lint:
    name: Repository lints (shellcheck, actionlint, hadolint, typos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tools.sh') }}
      - run: scripts/lint-repo.sh

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

  binaries:
    name: Binaries
    if: ${{ !inputs.skip-binaries }}
    uses: ./.github/workflows/build-binaries.yml
