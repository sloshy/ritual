name: Feature request
description: Suggest a new capability or a change to an existing one.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you'd like it to work. A sketch of the command, flag or screen helps.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surfaces affected
      multiple: true
      options:
        - CLI
        - Admin site
        - Public site
        - MCP server
        - Skills
        - List file format
        - Not sure
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches you thought about.
